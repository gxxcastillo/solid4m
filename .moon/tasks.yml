$schema: 'https://moonrepo.dev/schemas/tasks.json'

implicitInputs:
  - 'package.json'

fileGroups:
  configs:
    - '*.config.{js,cjs,mjs}'
    - '*.json'
  sources:
    - './src/**/*'
    - 'types/**/*'
  tests:
    - './tests/**/*'
    - './src/**/*.{test,bench}.{ts,tsx}'
    - '/*.test.ts'
    - '**/__tests__/**/*'

tasks:
  test:
    command: vitest
    args:
      - run
      - --passWithNoTests
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - 'vitest.config.*'
      - 'package.json'
      - '/tsconfig.options.json'

  coverage:
    command: vitest
    args:
      - run
      - --coverage
      - --passWithNoTests
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - 'vitest.config.*'
      - 'package.json'
      - '/tsconfig.options.json'

  bench:
    command: vitest
    args:
      - bench
      - --passWithNoTests
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - 'vitest.config.*'
      - 'package.json'
      - '/tsconfig.options.json'

  build:
    command: vite
    args:
      - build
    deps:
      - '^:build'

  # A workspace import resolves through package.json's `types` to upstream
  # declarations: an internal package's are the dist/ its own `types` task
  # writes, the facade's are the bundle its `build` writes. So both must finish
  # first. `^:types` also keeps two `tsc --build` runs from rebuilding the
  # same referenced project at once.
  types:
    command:
      - 'tsc'
      - '--build'
    deps:
      - '^:types'
      - '^:build'
    inputs:
      # Source and test files
      - '@globs(sources)'
      - '@globs(tests)'
      # Project configs
      - 'tsconfig.json'
      - 'tsconfig.*.json'
      # Root configs (extended from only)
      - '/tsconfig.options.json'

  lint:
    command:
      - 'eslint'
      # Support other extensions
      # - '--ext'
      # - '.js,.jsx,.ts,.tsx'
      # No `--fix` here: CI runs this task, and a fix applied on the runner is
      # thrown away while the run reports green. Use `lint-fix` locally.
      - '--report-unused-disable-directives'
      # Dont fail if a project has nothing to lint
      - '--no-error-on-unmatched-pattern'
      # Do fail if we encounter a fatal error
      - '--exit-on-fatal-error'
      # Only 1 ignore file is supported, so use the root
      - '--ignore-path'
      - '@in(4)'
      # Run in current dir
      - '.'
    # The type-aware rules read the same upstream declarations as `types` (see
    # there).
    deps:
      - '^:types'
      - '^:build'
    inputs:
      # Source and test files
      - 'src/**/*'
      - 'tests/**/*'
      # Other config files
      - '*.config.*'
      # Project configs, any format, any depth
      - '**/.eslintrc.*'
      # Root configs, any format
      - '/.eslintignore'
      - '/.eslintrc.*'
      - 'types/**/*'
      - 'tsconfig.json'
      - '/tsconfig.eslint.json'
      - '/tsconfig.options.json'

  lint-fix:
    extends: 'lint'
    args:
      - '--fix'
    options:
      cache: false

  format:
    command:
      - 'prettier'
      - '--write'
      - '--ignore-path'
      - '../../.prettierignore'
      - '--config'
      - '../../.prettierrc.yml'
      - '.'
