$schema: 'https://moonrepo.dev/schemas/tasks.json'

implicitInputs:
  - 'package.json'

fileGroups:
  configs:
    - '*.config.{js,cjs,mjs}'
    - '*.json'
  sources:
    - './src/**/*'
    - 'types/**/*'
  tests:
    - './tests/**/*'
    - './src/**/*.{test,bench}.{ts,tsx}'
    - '/*.test.ts'
    - '**/__tests__/**/*'

tasks:
  test:
    command: vitest
    args:
      - run
      - --passWithNoTests
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - 'vitest.config.*'
      - 'package.json'
      - '/tsconfig.options.json'

  coverage:
    command: vitest
    args:
      - run
      - --coverage
      - --passWithNoTests
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - 'vitest.config.*'
      - 'package.json'
      - '/tsconfig.options.json'

  bench:
    command: vitest
    args:
      - bench
      - --passWithNoTests
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - 'vitest.config.*'
      - 'package.json'
      - '/tsconfig.options.json'

  build:
    command: vite
    args:
      - build
    deps:
      - '^:build'

  # A workspace import resolves through package.json's `types`: an internal
  # package's point at the dist/ its own `types` task writes, the facade's at
  # the bundle its `build` writes. Both must finish first. `^:types` also
  # keeps two `tsc --build` runs from rebuilding the same referenced project
  # at once.
  types:
    command:
      - 'tsc'
      - '--build'
    deps:
      - '^:types'
      - '^:build'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - 'tsconfig.json'
      - 'tsconfig.*.json'
      # Extended by tsconfig.json; not otherwise referenced here.
      - '/tsconfig.options.json'

  lint:
    command:
      - 'eslint'
      # No `--fix`: CI runs this task, and a fix applied on the runner is
      # thrown away while the run still reports green. Use `lint-fix` locally.
      - '--report-unused-disable-directives'
      - '--no-error-on-unmatched-pattern'
      - '--exit-on-fatal-error'
      # eslint accepts only one ignore file per run, so every project points
      # at the root's.
      - '--ignore-path'
      - '@in(4)'
      - '.'
    # Same upstream-declaration dependency as `types` (see there).
    deps:
      - '^:types'
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - '*.config.*'
      - '**/.eslintrc.*'
      - '/.eslintignore'
      - '/.eslintrc.*'
      - 'types/**/*'
      - 'tsconfig.json'
      - '/tsconfig.eslint.json'
      - '/tsconfig.options.json'

  lint-fix:
    extends: 'lint'
    args:
      - '--fix'
    options:
      cache: false

  format:
    command:
      - 'prettier'
      - '--write'
      - '--ignore-path'
      - '../../.prettierignore'
      - '--config'
      - '../../.prettierrc.yml'
      - '.'
