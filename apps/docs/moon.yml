$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

tasks:
  dev:
    command: 'astro'
    args:
      - 'dev'

  preview:
    command: 'astro'
    args:
      - 'preview'

  build:
    command: 'astro'
    args:
      - 'build'
    options:
      mergeArgs: 'replace'

  types:
    command: 'astro'
    args:
      - 'check'
    # The docs' `paths` alias does not reach imports inside the referenced
    # `examples` project, which resolve `solid4m` through its package exports
    # to the facade's built `dist/index.d.ts`. Without this dep the check races
    # the build and fails on a clean checkout, while passing locally on a
    # leftover `dist/`.
    deps:
      - '^:build'
    options:
      mergeArgs: 'replace'
