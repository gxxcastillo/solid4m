$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

tasks:
  dev:
    command: 'astro'
    args:
      - 'dev'

  preview:
    command: 'astro'
    args:
      - 'preview'

  build:
    command: 'astro'
    args:
      - 'build'
    options:
      mergeArgs: 'replace'

  types:
    command: 'astro'
    args:
      - 'check'
    # The docs' `paths` alias doesn't reach imports inside `examples`, which
    # resolves `solid4m` through package exports to the facade's built
    # `dist/index.d.ts`. Without this dep the check races the build: it passes
    # locally on a leftover `dist/` but fails on a clean checkout.
    deps:
      - '^:build'
    options:
      mergeArgs: 'replace'
