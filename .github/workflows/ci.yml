name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Enable corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Install moon
        run: pnpm exec moon --version || pnpm add -g @moonrepo/cli

      - name: Type check
        run: pnpm moon :types

      - name: Lint
        run: pnpm moon :lint

      - name: Test
        run: pnpm moon :test

      - name: Coverage
        run: pnpm moon :coverage

      - name: Build
        run: pnpm moon :build

      - name: Bundle size
        run: node packages/solid4m/scripts/check-bundle-size.mjs

      - name: Accessibility
        run: pnpm moon :a11y

      - name: Verify pack
        run: |
          cd packages/solid4m
          pnpm pack
          node -e "
            const {execSync} = require('child_process');
            const files = execSync('tar -tzf solid4m-*.tgz', {encoding:'utf8'});
            const p = JSON.parse(execSync('tar -xOf solid4m-*.tgz package/package.json', {encoding:'utf8'}));
            if (p.dependencies && Object.keys(p.dependencies).length)
              throw new Error('unexpected dependencies: ' + JSON.stringify(p.dependencies));
            if (JSON.stringify(p.exports).includes('development'))
              throw new Error('development export condition found in packed tarball');
            for (const entry of ['package/dist/index.js', 'package/dist/index.d.ts', 'package/dist/server/index.js']) {
              if (!files.includes(entry)) throw new Error(entry + ' missing from tarball');
            }
            const declarations = files.split('\n').filter((file) => file.endsWith('.d.ts'));
            if (declarations.length !== 1 || declarations[0] !== 'package/dist/index.d.ts')
              throw new Error('unexpected declaration files: ' + JSON.stringify(declarations));
            const types = execSync('tar -xOf solid4m-*.tgz package/dist/index.d.ts', {encoding:'utf8'});
            if (types.includes('@gxxc/'))
              throw new Error('bundled declarations reference private packages');
            // B5: solid-js/web's DOM runtime (template/delegateEvents) must
            // never be inlined — it assumes \`document\` exists, which crashes
            // the server entry, and doubles the DOM entry's bundle size.
            for (const entry of ['package/dist/index.js', 'package/dist/server/index.js']) {
              const code = execSync(\`tar -xOf solid4m-*.tgz \${entry}\`, {encoding:'utf8'});
              if (/function template\(|function delegateEvents\(/.test(code))
                throw new Error(entry + ' inlines solid-js/web\\'s DOM runtime');
            }
            console.log('pack ok');
          "
          rm solid4m-*.tgz

      - name: Verify tarball SSR + hydration
        run: |
          cd verify-tarball
          node run.mjs
