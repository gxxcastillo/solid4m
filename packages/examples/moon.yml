$schema: 'https://moonrepo.dev/schemas/project.json'

# No build of its own: the docs and a11y apps consume it from src/ (its only
# export). See AGENTS.md on why dist/ must have a single writer.
workspace:
  inheritedTasks:
    exclude: ['build']

tasks:
  # Excluding `build` also removes its inherited facade-build dependency.
  types:
    deps:
      - '^:types'
      - 'solid4m:build'

  lint:
    deps:
      - '^:types'
      - 'solid4m:build'
