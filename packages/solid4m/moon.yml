$schema: 'https://moonrepo.dev/schemas/project.json'

# Two full `vite build` passes, browser and server (see vite.server.config.ts
# for why one config can't produce both). scripts/build.mjs drives both
# through Vite's JS API instead of two shell-level `vite build --config`
# invocations.
tasks:
  build:
    command: 'node'
    args:
      - 'scripts/build.mjs'
    # The declaration bundle follows each internal package's `types` into the
    # dist/ its `types` task (tsc) writes; they have no build of their own.
    deps:
      - '^:types'
    options:
      mergeArgs: 'replace'
