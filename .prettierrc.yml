plugins:
  - '@trivago/prettier-plugin-sort-imports'

printWidth: 110
trailingComma: 'none'
singleQuote: true
jsxSingleQuote: true

# @trivago/prettier-plugin-sort-imports
importOrder:
  - '^solid-formation(.*)$'
  - '^@gxxc/solid-formation(.*)$'
  - '^[./]'
importOrderSeparation: true
importOrderSortSpecifiers: true
